# Server configuration
server.port=8080

# Database Configuration
# Defaulting to H2 for easy development/testing without requiring MySQL setup
spring.datasource.url=jdbc:h2:file:./data/devsentrydb;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Uncomment below to use MySQL (and comment H2 above)
# spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/devsentry}
# spring.datasource.username=${DATABASE_USERNAME:root}
# spring.datasource.password=${DATABASE_PASSWORD:password}
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:8f7b243b8d4e9c71a35f6e8b4d2a1c9f0b7e5d3c1a9f6e4b2d8c0a5f3e7b1d9}
jwt.expiration=86400000

# Spring AI Configuration (Fallback mechanism will handle missing key)
spring.ai.openai.api-key=${AI_API_KEY:sk-fake-key-for-demo}

# Logging
logging.level.org.springframework.security=INFO
